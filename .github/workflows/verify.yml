name: 90-day policy re-verification

on:
  schedule:
    # Mondays 15:00 UTC (~7am Pacific)
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  # One matrix job per city with published venues: a failure or timeout in
  # one city never discards another city's work, and cities re-verify in
  # parallel instead of one 6-hour-capped sequential scan.
  plan:
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.list.outputs.cities }}
    steps:
      - uses: actions/checkout@v4
      # Directories only (a stray file must not become a matrix "city").
      # NOTE: GitHub caps a matrix at 256 jobs — before the city count
      # approaches that, switch this to emitting chunked city groups.
      - id: list
        run: |
          cities=$(find apps/web/src/content/venues -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(. != ""))')
          if [ "$cities" = "[]" ]; then
            echo "No venue directories found — nothing to verify."
            exit 1
          fi
          echo "cities=$cities" >> "$GITHUB_OUTPUT"
          echo "Cities: $cities"

  verify:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        city: ${{ fromJSON(needs.plan.outputs.cities) }}
    steps:
      # PIPELINE_PAT (a fine-grained PAT or GitHub App token with contents +
      # pull-requests write) is REQUIRED for the CI build check to run on the
      # PRs this workflow opens: GitHub suppresses workflow triggers on
      # events created with the default GITHUB_TOKEN. Without it, bot PRs
      # show no checks at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # claude-code is pinned: an unpinned install-latest changes the
      # behavior of every scheduled run overnight with no way to bisect.
      # Bump deliberately.
      - name: Install pipeline dependencies
        run: |
          pip install -r pipeline/requirements.txt
          npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Configure git author
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"

      # Auth: prefers the Claude subscription via CLAUDE_CODE_OAUTH_TOKEN
      # (create locally with `claude setup-token`). If ANTHROPIC_API_KEY is
      # set instead, the pipeline uses direct API billing.
      # --limit caps one city's run so a killed job wastes bounded model
      # spend; oldest venues go first, the rest roll to next week.
      - name: Re-verify stale venues and open PR
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PIPELINE_PAT || secrets.GITHUB_TOKEN }}
        run: python pipeline/verify.py --city "${{ matrix.city }}" --limit 25
