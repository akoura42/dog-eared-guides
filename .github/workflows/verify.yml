name: 90-day policy re-verification

on:
  schedule:
    # Mondays 15:00 UTC (~7am Pacific)
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Configure git author
        run: |
          git config user.name "verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"

      - name: Re-verify stale venues and open PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/verify.py
