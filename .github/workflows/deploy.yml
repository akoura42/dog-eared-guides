name: Deploy to Cloudflare Workers

# In-repo deploy so shipping is versioned, auditable, and fails loudly.
# The site is a Cloudflare Workers static-assets project (apps/web/
# wrangler.jsonc — name, assets dir, and custom domains all live there).
# Requires:
#   repo variable  CF_DEPLOY_ENABLED=true   (gates the job)
#   repo secrets   CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Zone:
#                  Workers Routes: Edit for the custom domains),
#                  CLOUDFLARE_ACCOUNT_ID
#   repo variables/secrets for the production env — see apps/web/.env.example
# The Cloudflare dashboard's "Workers Builds" git integration never
# produced a working build (no wrangler config existed) — disconnect it
# when enabling this workflow so there is exactly one deployer.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CF_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Build
        working-directory: apps/web
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_GMAPS_API_KEY: ${{ secrets.PUBLIC_GMAPS_API_KEY }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.PUBLIC_CF_ANALYTICS_TOKEN }}
          BOOKING_AFFILIATE_AID: ${{ secrets.BOOKING_AFFILIATE_AID }}
          VIATOR_PARTNER_ID: ${{ secrets.VIATOR_PARTNER_ID }}
          PET_INSURANCE_URL: ${{ vars.PET_INSURANCE_URL }}
          PET_INSURANCE_PARTNER: ${{ vars.PET_INSURANCE_PARTNER }}
        run: npm run build
      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
