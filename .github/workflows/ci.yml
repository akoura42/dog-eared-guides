name: Build check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # TypeScript diagnostics across .astro/.ts files.
      - run: npm run check
        working-directory: apps/web
      # The Astro build runs the strict Zod schemas over all content —
      # this is the machine gate for pipeline-generated PRs.
      - run: npm run build
        working-directory: apps/web

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      # Dog-Eared Index band math: golden-file tests + drift check on every
      # town's stored index.yaml.
      - run: python -m pytest pipeline/index/test_compute.py -q
      - name: Index drift check (compute.py --check per city with an index)
        run: |
          shopt -s nullglob
          files=(data/cities/*/index.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No index.yaml files found — the drift gate has nothing to check."
            echo "If city data moved, update this glob; failing rather than passing silently."
            exit 1
          fi
          for f in "${files[@]}"; do
            slug="$(basename "$(dirname "$f")")"
            python pipeline/index/compute.py "$slug" --check
          done
      # Every data file (city yamls, index/zones, ledger rows, check log,
      # queues) against the canonical schemas in data/schema/.
      - name: Data schema check
        run: python pipeline/schemas.py --check-all
      - name: Pipeline syntax check
        run: python -m compileall -q pipeline
