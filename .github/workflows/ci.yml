name: Build check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      # TypeScript diagnostics across .astro/.ts files.
      - run: npm run check
        working-directory: apps/web
      # The Astro build runs the strict Zod schemas over all content —
      # this is the machine gate for pipeline-generated PRs.
      - run: npm run build
        working-directory: apps/web

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      # Dog-Eared Index band math: golden-file tests + drift check on every
      # town's stored index.yaml.
      - run: python -m pytest pipeline/index/test_compute.py -q
      - name: Index drift check (compute.py --check per town)
        run: |
          for town in data/towns/*/; do
            slug="$(basename "$town")"
            python pipeline/index/compute.py "$slug" --check
          done
      - name: Pipeline syntax check
        run: python -m compileall -q pipeline
