hero:
  headline: Tahoe City with a dog.
  subhead: Patios, trails, lake access, and lodging on Tahoe's West Shore — every dog policy verified.
hero_image: tahoe-city/lakefront.jpg
hero_image_alt: View over Lake Tahoe and the marina from Tahoe City, pines in the foreground
hero_image_credit: DimiTalen, CC0, via Wikimedia Commons
hero_image_credit_url: https://commons.wikimedia.org/wiki/File:View_over_Lake_Tahoe_from_Tahoe_City,_2011.jpg
intro: >-
  Tahoe City sits where the Truckee River leaves Lake Tahoe — a walkable lakefront
  town ringed by national forest, state parks, and 23 miles of paved trail.
  It's a genuinely good dog town with a patchwork of rules: county leash law,
  utility-district beach rules, State Parks orders, and Forest Service closures
  all apply within a few miles. Every policy here comes from the ordinances themselves.
seasonal_notes:
  - "Winter (Nov 1 – May 1): dogs are prohibited on designated Nordic ski trails in Sierra District state parks when snow is present — including the trail networks at Burton Creek State Park (directly behind town) and Ed Z'berg Sugar Pine Point State Park."
  - "Summer: harmful algal blooms can seriously sicken a dog within hours, and advisories have been posted around Lake Tahoe — California's HAB map lists the current ones."
  - "Year-round: the US Forest Service warns that giardia is present in Tahoe-area lakes and streams, which rules them out as drinking water for dogs."
regulations:
  - summary: Dogs must be leashed (or otherwise restrained) everywhere off your own property in Tahoe City.
    detail: >-
      Tahoe City is unincorporated Placer County, where county code makes it unlawful
      to allow any animal to run "at large" — defined as off the owner's premises and
      not restrained by lead, leash, or adequate enclosure. The fenced TCPUD dog park
      at 375 Grove Street is the designated off-leash spot in town.
    jurisdiction: Placer County
    source_url: https://www.placer.ca.gov/DocumentCenter/View/11009/HEALTH-and-HUMAN-SERVICES-ANIMAL-SERVICES-PDF
  - summary: No dogs on Commons Beach — the main in-town beach.
    detail: >-
      The Tahoe City Public Utility District prohibits dogs on Commons Beach,
      with one exception: leashed dogs passing through on the paved multi-use trail.
    jurisdiction: Tahoe City PUD
    source_url: https://www.tcpud.org/parks-facilities/facilities-parks-and-rentals/beaches/commons-beach
  - summary: Dogs are welcome on the paved trail system — on a short leash.
    detail: >-
      TCPUD's rules for the Truckee River, West Shore, and North Shore multi-use
      trails require dogs on a short leash, kept to the handler's side. The trails
      are shared with bikes.
    jurisdiction: Tahoe City PUD
    source_url: https://www.tcpud.org/trails
  - summary: At Tahoe State Recreation Area, dogs are limited to the Truckee River Outlet ("Gatekeepers") day-use area.
    detail: >-
      California State Parks allows dogs at this in-town park only in the Truckee
      River Outlet day-use area along the shoreline, leashed and never unattended.
      The statewide baseline applies elsewhere: dogs on a max 6-foot leash in
      developed areas only, and not on beaches or unpaved trails unless posted.
    jurisdiction: California State Parks (Sierra District)
    source_url: https://www.parks.ca.gov/?page_id=504
  - summary: On national forest land, dogs must be leashed at all times — and six designated swim beaches ban pets.
    detail: >-
      The Forest Service's Lake Tahoe Basin Management Unit asks that dogs be
      leashed at all times and prohibits pets at six designated swim beaches,
      including William Kent Beach just south of Tahoe City. Leashed dogs are
      welcome on most forest trails.
    jurisdiction: US Forest Service (LTBMU)
    source_url: https://www.fs.usda.gov/r05/laketahoebasin/recreation/where-can-i-take-my-dog-lake-tahoe
  - summary: Winter ski-trail ban, Nov 1 – May 1.
    detail: >-
      A Sierra District order prohibits dogs on designated ski trails when snow is
      present, including the groomed networks at Burton Creek State Park and
      Ed Z'berg Sugar Pine Point State Park.
    jurisdiction: California State Parks (Sierra District)
    source_url: https://www.parks.ca.gov/pages/499/files/DSO%20683-22-002%20Dogs.pdf
  - summary: Dogs can't ride the TART bus, and the local on-demand shuttle is service-animals-only.
    detail: >-
      TART's rider rules state that "animals, other than service animals, are
      not permitted on buses." The free TART Connect shuttle follows the same
      line in the North Lake Tahoe zone — service animals only. The one
      exception is the separate Truckee TART Connect zone, which allows
      well-behaved pets in crates.
    jurisdiction: Tahoe Truckee Area Regional Transit
    source_url: https://tahoetruckeetransit.com/how-to-ride/
