hero:
  headline: Truckee with a dog.
  subhead: The rare California town where voice control is the law, Donner Lake has a legal dog shore, and the forest starts at the sidewalk.
intro: >-
  Truckee runs on an unusual rule: the Town's animal code prohibits dogs
  at large but does not require a leash — immediate voice and visual
  control is the legal standard on town streets and trails. The strict
  exceptions are posted where they apply: Truckee River Regional Park
  requires leashes May 1 through October 31, Donner Memorial State Park
  requires a six-foot leash everywhere dogs are allowed, and West End
  Beach admits no dogs at all. Every listing here cites the rule it
  rests on.
