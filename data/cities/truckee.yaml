seasonal_notes:
  - Truckee River Regional Park requires dogs on leash May 1 – October 31 (Town of Truckee).
  - Donner Memorial State Park bans dogs from designated ski trails when snow is present (California State Parks).
regulations:
  - summary: Dogs at large are prohibited; leash OR immediate voice-and-visual control is required
    detail: >-
      "Dog owners are required to keep their dogs under control by visual
      and voice control or by leash control. Voice and visual control
      requires that the owner is in the immediate presence of the animal
      and can demonstrate effective control of the animal." (Town of
      Truckee Municipal Code, Title 8.)
    jurisdiction: Town of Truckee
    source_url: https://www.truckeepolice.gov/faq/is-there-a-leash-law-in-truckee-2/
  - summary: Truckee River Regional Park — leash required May 1 through October 31
    detail: >-
      The Town's one strict seasonal leash zone: dogs must be leashed and
      under full control in any area of Truckee River Regional Park from
      May 1 to October 31.
    jurisdiction: Town of Truckee
    source_url: https://www.truckeepolice.gov/faq/is-there-a-leash-law-in-truckee-2/
  - summary: Donner Memorial State Park — six-foot leash; shore access except China Cove
    detail: >-
      "Dogs are allowed on the Lakeside Interpretive Trail, Zig Zag Trail,
      fire roads, and along the shore of Donner Lake except for China Cove
      Beach," on a six-foot maximum leash; dogs are not allowed in the
      visitor center, on the Nature Trail, at China Cove Beach, or on
      designated ski trails when snow is present.
    jurisdiction: California State Parks, Sierra District
    source_url: https://www.parks.ca.gov/?page_id=503
  - summary: West End Beach — no dogs
    detail: >-
      The district's main Donner Lake swim beach admits no dogs (posted
      with the no-glass and no-smoking rules).
    jurisdiction: Truckee-Donner Recreation & Park District
    source_url: https://www.tdrpd.org/165/West-End-Beach
