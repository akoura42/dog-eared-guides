# Getting there with a dog — airport and rail links with verified pet
# rules. Coordinates stored for a future map layer.
getting_there:
  - mode: air
    name: Charlotte Douglas International (CLT)
    note: Service-animal/pet relief areas run post-security (the A/B Connector near Checkpoint A, Concourse E near Gate E36, and the D/E corner) and pre-security outdoors at both ends of the Arrivals/Baggage Claim level. Except for service animals, pets stay in carriers inside the terminal.
    source_url: https://www.cltairport.com/airport-info/accessibility/terminal-amenities/service-animal-relief-areas/
    lat: 35.2140
    lng: -80.9431
  - mode: rail
    name: Amtrak (Crescent, Carolinian, Piedmont)
    note: Amtrak's carry-on pet program takes dogs and cats up to 20 pounds including the carrier, on trips of up to seven hours, in coach, with a per-segment fee and a five-pets-per-train cap — reservations required. The carrier maximum is 19" x 14" x 10.5".
    source_url: https://www.amtrak.com/pets
    lat: null
    lng: null
# Verified emergency contacts — the /charlotte/emergency/ page and the
# pocket card render from this. Drive times via OSRM from Trade & Tryon.
emergency:
  er_vets:
    - name: CARE — Charlotte Animal Referral & Emergency
      phone: (704) 457-2300
      lat: 35.19498
      lng: -80.79706
      note: Open 24 hours, every day. 3726 Latrobe Dr — about 10 minutes from Uptown.
      source_url: https://carecharlotte.com/services/emergency/
    - name: BluePearl Pet Hospital South Charlotte (Matthews)
      phone: (704) 672-5590
      note: 24-hour emergency and specialty hospital at 2440 Plantation Center Dr, southeast of I-485 off Weddington Road, serving south Charlotte.
      source_url: https://bluepearlvet.com/hospital/matthews-nc/
  poison:
    - name: ASPCA Animal Poison Control
      phone: (888) 426-4435
      note: 24/7, 365 days a year. A consultation fee applies.
      source_url: https://www.aspca.org/pet-care/animal-poison-control
  lost_found:
    - name: CMPD Animal Care & Control (main shelter)
      phone: (704) 336-7600
      lat: 35.19202
      lng: -80.94841
      note: Lost & found, intake, and animal protection run from the main shelter at 8315 Byrum Dr (the Toomey Ave location is adoptions only). Open daily; 311 reaches them from inside Mecklenburg County.
      source_url: https://www.charlottenc.gov/Animal-Care-and-Control
