hero:
  headline: Charlotte with a dog.
  subhead: Breweries, greenways, patios, and dog parks across the Queen City — every dog policy verified.
hero_image: null
hero_image_alt: null
hero_image_credit: null
hero_image_credit_url: null
intro: >-
  Charlotte is the big-city counterpoint to our mountain towns — a city of
  neighborhoods where the dog rules are unusually uniform. One county
  animal ordinance covers the city, one park system runs the parks and
  greenways, and designated dog parks are the only legal off-leash
  ground. Every policy here comes from the ordinances themselves.
seasonal_notes: []
regulations:
  - summary: Dogs must be physically restrained — leash, fence, or secure enclosure — everywhere off your own property.
    detail: >-
      The Mecklenburg County animal ordinance (Sec. 3-71), enforced in
      Charlotte by CMPD Animal Care & Control, makes it unlawful to keep
      any animal (cats excepted) without sufficient physical restraint —
      a leash, a vehicle, or an adequate fence or enclosure. The one
      voice-control allowance is on your own property, with an adult
      immediately beside a dog that responds to direct verbal commands.
    jurisdiction: Mecklenburg County / CMPD Animal Care & Control
    source_url: https://www.charlottenc.gov/Animal-Care-and-Control/Pet-Resources/Mecklenburg-County-Animal-Ordinance
  - summary: In public parks and on greenways, dogs stay leashed — designated dog parks are the off-leash exception.
    detail: >-
      Mecklenburg County Park and Recreation requires leashed dogs in all
      parks and on greenways; its designated dog parks are the off-leash
      areas, open 7:30am to sunset, free, with posted vaccination
      requirements (rabies with tag, DHLPP, bordetella) and separate
      sections for dogs over and under 20 pounds at most locations.
    jurisdiction: Mecklenburg County Park and Recreation
    source_url: https://parkandrec.mecknc.gov/Places-to-Visit/Dog-Parks
  - summary: State rule allows dogs in outdoor dining areas — at the restaurant's discretion.
    detail: >-
      The North Carolina food code (15A NCAC 18A .2656, adopting Food Code
      6-501.115(B)(4)) permits "dogs (Canis lupus familiaris) and cats" in
      outdoor dining areas "provided that dogs and cats are physically
      restrained, and do not pass through any indoor areas of the food
      establishment." Restaurants may still say no — which is why every
      patio policy in this guide is verified per venue.
    jurisdiction: North Carolina (state food code)
    source_url: https://www.animallaw.info/administrative/nc-restaurant-animals-2656-physical-facilities
resources:
  - label: Mecklenburg County dog parks
    url: https://parkandrec.mecknc.gov/Places-to-Visit/Dog-Parks
