- type: venue
  city: tahoe-city
  name: Bridgetender Tavern & Grill
  category: eat
  notes: 'TIER 3 — CONFLICTING EVIDENCE, phone call required: (530) 583-3342. Official
    site publishes no pet policy. Visitor mentions conflict: older reviews (BringFido,
    TripAdvisor, Yelp ~2019) describe dogs in a designated non-riverfront outdoor
    area (sometimes only tied adjacent to the patio); the most recent dated mentions
    (Yelp answers ~2022, a 2022-07-08 phone-check blog comment) report the policy
    tightened or revoked after patrons abused the back patio. Fails the tier-2 agreement
    requirement. Whatever the call establishes becomes tier 1 via method: phone.'
  done: true
  done_date: '2026-08-09'
  done_note: duplicative of ledger row bridgetender-tavern-and-grill (unverifiable,
    phone call pending) — the ledger carries the follow-up
